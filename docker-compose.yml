services:
  postgres:
    image: postgres:16-alpine
    container_name: paola-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: paola
      POSTGRES_PASSWORD: paola_local_dev
      POSTGRES_DB: paola_calzados
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paola -d paola_calzados"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
